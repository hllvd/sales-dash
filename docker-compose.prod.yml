
services:
  salesapp-api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/salesapp-api:${IMAGE_TAG:-latest}
    container_name: salesapp-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/SalesApp.db;Cache=Shared;Mode=ReadWriteCreate;
      - CW_ERROR_LOG=${CW_ERROR_LOG:-false}
      - CW_LOG_GROUP=${CW_LOG_GROUP:-/salesapp/api/errors}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/salesapp-client:${IMAGE_TAG:-latest}
    container_name: salesapp-client
    restart: always
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      salesapp-api:
        condition: service_started
      client:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: alpine:3.20
    container_name: backup
    restart: always
    environment:
      - S3_BUCKET_NAME=${BACKUP_S3_BUCKET}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - MAX_BACKUPS=${BACKUP_MAX_KEEP:-7}
    volumes:
      - ./data:/app/data
      - ./backup:/config
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache rclone sqlite && exec /config/backup.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
