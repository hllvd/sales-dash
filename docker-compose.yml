services:
  salesapp-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        BUILD_ID: "${BUILD_ID:-}"
    container_name: salesapp-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CW_ERROR_LOG=${CW_ERROR_LOG:-false}
      - CW_LOG_GROUP=${CW_LOG_GROUP:-/salesapp/api/errors}
    ports:
      - "5001:5000"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - scrape-data:/app/outputs

  pbi-scraper:
    build:
      context: ./pbi-scraper
      dockerfile: Dockerfile
    container_name: pbi-scraper
    environment:
      - PBI_TOKEN=${PBI_TOKEN}
      - AVAPRO_MATRICULA=${AVAPRO_MATRICULA:-}
      - AVAPRO_PASSWORD=${AVAPRO_PASSWORD:-}
      - PORT=3001
      - OUTPUT_DIR=/app/outputs
    volumes:
      - scrape-data:/app/outputs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        - REACT_APP_AWS_RUM_APP_ID=${REACT_APP_AWS_RUM_APP_ID}
        - REACT_APP_AWS_REGION=${REACT_APP_AWS_REGION}
        - REACT_APP_AWS_RUM_IDENTITY_POOL_ID=${REACT_APP_AWS_RUM_IDENTITY_POOL_ID}
    container_name: salesapp-client
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      salesapp-api:
        condition: service_started
      client:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scrape-data: {}
